name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate contract artifacts
        run: npm run generate

      - name: Fail on generated-artifact drift
        run: git diff --exit-code -- public/schema/project-bundle.json docs/arkaik-skill/scripts/validate-bundle.js docs/arkaik-skill/references/schema.md lib/prompts/generated plugin/.claude-plugin/plugin.json plugin/.mcp.json plugin/skills/arkaik lib/wobble/wobble-registry.generated.ts app/wobble.generated.css

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate seed bundles
        run: npm run validate:seeds

      - name: Validate bundle fixtures
        run: npm run test:fixtures

      - name: Schema validator parity tests
        run: npm run test:schema

      - name: Acceptance model tests
        run: npm run test:acceptance

      - name: Mutation core tests (applyOps invariants, batch atomicity)
        run: npm run test:mutate

      - name: Ref promotion policy tests (opt-in, per-platform, guards)
        run: npm run test:promote

      # The layer directly above test:promote. Deliberately in `build`, not
      # `services`: the whole point is that the PR planner's logic is checked
      # without a database, so a regression fails on a laptop instead of only
      # in the Postgres job.
      - name: GitHub PR planning tests (mention grammar, per-platform ref ids)
        run: npm run test:pr-plan

      # The layer below the planner, and in `build` for the same reason: path
      # matching, the App JWT and the changed-files client are all pure or take
      # their fetch as a parameter, so none of it needs a database or a socket.
      - name: GitHub App seam tests (path matching, App JWT, changed-files API)
        run: npm run test:github-app

      - name: Deterministic id generator tests
        run: npm run test:id-gen

      - name: Canonical serialization determinism tests
        run: npm run test:serialize

      - name: Ref + version format field tests
        run: npm run test:refs

      - name: Journal (Level 2) tests
        run: npm run test:journal

      - name: Journal projection tests
        run: npm run test:journal-projections

      - name: Map projection + validation tests
        run: npm run test:maps

      - name: Delivery board grouping tests
        run: npm run test:delivery

      - name: Journey graph golden parity tests
        run: npm run test:journey-graph

      - name: Neighborhood spotlight tests
        run: npm run test:spotlight

      - name: Command palette ranking tests
        run: npm run test:command-palette

      - name: Overview coverage projection tests
        run: npm run test:coverage

      - name: Value icon resolution tests
        run: npm run test:value-icons

      - name: Acceptance matrix util tests
        run: npm run test:acceptance-matrix

      - name: Effective platform-status seam tests
        run: npm run test:effective-status

      - name: Pyramid aggregation tests
        run: npm run test:pyramid

      - name: Journal write-primitive (emit) tests
        run: npm run test:emit

      - name: App-side journal emission tests
        run: npm run test:emit-events

      - name: Screenshot data-URI size warning tests
        run: npm run test:screenshot-size

      - name: Bundle migration chain tests
        run: npm run test:migrate

      - name: Provider-injection seam + mutation-notification tests
        run: npm run test:provider

      - name: Projects page section + create-target routing
        run: npm run test:project-sections

      - name: CLI tests
        run: npm run test:cli

      - name: MCP server tests
        run: npm run test:mcp

  # Services migration-integrity gate (docs/spec/services.md § CI Additions).
  # Separate job so the local-first `build` job above stays green with no DB.
  services:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arkaik
          POSTGRES_PASSWORD: arkaik
          POSTGRES_DB: arkaik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkaik -d arkaik_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://arkaik:arkaik@localhost:5432/arkaik_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Re-run migrations (idempotency gate — must be a no-op, exit 0)
        run: npm run db:migrate

      - name: Publik API integration tests
        run: npm run test:publik
      - name: Synk auth-guard integration test (unauthenticated → 401)
        run: npm run test:auth
      - name: Token auth integration tests (mint/verify/revoke, scopes, owner isolation)
        run: npm run test:tokens
      - name: Hosted graph API integration tests (atomicity, validator gate, owner scoping)
        run: npm run test:graph
      - name: GitHub webhook integration tests (signature, replay guard, promotion)
        run: npm run test:github
      - name: Synk API integration tests (authz isolation, dedupe, limits, retention)
        run: npm run test:synk
      - name: Synk client SyncManager tests (debounce, hash, status transitions)
        run: npm run test:sync
